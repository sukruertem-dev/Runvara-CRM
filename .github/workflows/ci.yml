name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 10.34.9 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Design tokens, permission matrix, module catalogue
        run: pnpm check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Timing budgets run alone: inside `pnpm test` every package's suite shares the runner's CPU.
      - name: Performance budget (100k-edge dependency cycle check < 1 s)
        run: pnpm --filter @flexa/workflow test:perf
      - name: Storybook (component documentation must build)
        run: pnpm --filter @flexa/ui build-storybook
      - name: 'Integration tests (Testcontainers: PostgreSQL 18 + Redis 7 + SeaweedFS)'
        run: pnpm test:int

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 10.34.9 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: node scripts/dev-env.mjs
      - uses: docker/setup-buildx-action@v3
      # Image layers are cached in GitHub Actions between runs: the dependency layer (pnpm fetch) is rebuilt only
      # when the lockfile changes, so a typical run builds just the application code.
      - name: Build images (cached)
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha,scope=flexa-e2e
            *.cache-to=type=gha,scope=flexa-e2e,mode=max
      - name: Start the stack from scratch
        run: docker compose up --wait --wait-timeout 600
      - run: pnpm install --frozen-lockfile --filter @flexa/web...
      - run: pnpm --filter @flexa/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: 'true' }
      # Baselines live in apps/web/e2e/__screenshots__ and are produced in the same pinned Linux image.
      - name: Screenshot regression (light/dark, desktop/mobile)
        run: pnpm --filter @flexa/web e2e:visual
        env: { CI: 'true' }
      - name: Lighthouse (production build, mobile profile)
        run: pnpm --filter @flexa/web lighthouse
        env: { LH_RUNS: '3' }
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-report
          path: apps/web/lighthouse-report
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts
          path: |
            compose.log
            apps/web/playwright-report
            apps/web/test-results
            apps/web/test-results-visual
