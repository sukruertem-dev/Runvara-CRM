# Flexa permission matrix — single source for seed data and generated authorization tests.
# Source: CRM_TASK_PLATFORM_PROMPT.md §10.4.3 (Matrix A), §10.4.4 (Matrix B + scenarios),
#         §10.4.5 (Matrix C), §11.4 (AI matrix + scenarios). Semantics: docs/adr/0004-yetki-motoru.md
# Consistency with the source tables is verified by scripts/check-permission-matrix.mjs
# (every `label` and every `cells` string must equal the source table cell, markdown bold removed).
#
# Cell symbols: ● full · ◐ scoped · ✓ can approve · R read only · T can request · — none
# grant.mode:  full | read | approve | request | none
# grant.scope: own | queue | team | segment | all   (list = union)
# grant.policy: tenant policy key that must be enabled (see `policies`)
# grant.constraints: named rules enforced by packages/authz (see `constraints`)

version: 1
roles:
  admin:      { label: Admin,             system: true, default_scope: all }
  manager:    { label: Yönetici,          system: true, default_scope: team }
  sales_rep:  { label: Satış Temsilcisi,  system: true, default_scope: own }
  call_agent: { label: Çağrı Temsilcisi,  system: true, default_scope: [queue, own] }
  analyst:    { label: Analist,           system: true, default_scope: all, read_only: true }

protected_permissions:          # cannot be removed from the Admin system role (ADR-0004 §8)
  - authz.matrix.edit
  - tenant.modules.manage
  - users.manage

constraints:
  no_escalation:        Granter may only grant permission keys and scopes they hold themselves (scope order own < {queue,team} < segment < all).
  own_segments_only:    Granted segments must be a subset of the granter's active segments.
  managed_teams_only:   Target user must be a member of a team the granter manages.
  not_self:             Granter cannot change their own roles, segments, scopes or delegations.
  no_admin_assignment:  Granter cannot assign the Admin role or any role containing authz.matrix.edit, tenant.modules.manage or platform.*.
  approve_within_limit: Approver's approve_limit must cover the request; otherwise escalate to the next level.
  requires_approval:    Action creates an approval request instead of taking effect immediately.
  requires_notice:      Monitored party is notified (and announcement played if policy requires).
  bulk_limit:           Bulk operations limited to policies.bulk_max_items_own items.
  consent_required:     B2C outbound contact requires channel consent, calling hours and DNC check.

policies:                      # defaults from §10.2.4; changed only by Admin, audited
  report_export_enabled:            { default: false }
  recording_listen_enabled:         { default: false }
  recording_listen_own_enabled:     { default: false }
  live_monitoring_enabled:          { default: false, requires: [requires_notice] }
  mention_grants_access:            { default: false }
  cost_margin_visible_to_manager:   { default: false }
  cost_margin_visible_to_analyst:   { default: false }
  sales_rep_telephony_enabled:      { default: false }
  ai_user_reports_enabled:          { default: true }
  ai_transcript_inclusion_enabled:  { default: false, note: next release }
  bulk_max_items_own:               { default: 100 }

# Generic record resources: expanded at seed time to every record resource of every enabled module
# (crm.lead, crm.contact, crm.account, crm.opportunity, crm.case, core.task, sales_b2b.quote,
#  sales_b2b.contract, sales_b2c.order, sales_b2c.return, call_center.call, ...).
record_resources: "*record*"

matrix_a:
