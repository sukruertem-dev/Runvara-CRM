    permissions: [users.invite, users.manage]
    cells: { admin: "●", manager: "◐ (kendi ekibine, kendi yetkisini aşmadan)", sales_rep: "—", call_agent: "—", analyst: "—" }
    grants:
      admin:   { mode: full, scope: all }
      manager: { mode: full, scope: team, permissions: [users.invite], constraints: [managed_teams_only, no_escalation, no_admin_assignment] }
  - id: A05
