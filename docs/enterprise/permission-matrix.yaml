# §10.4.5 Matrix C — module/sales-mode behaviour (E2E expectations)
matrix_c:
  b2b_only:            { menus: [b2b], segment_switcher: hidden,  reports: [b2b] }
  b2c_only:            { menus: [b2c], segment_switcher: hidden,  reports: [b2c] }
  both:                { menus: [b2b, b2c], segment_switcher: visible, switcher_options: [b2b, b2c, all], reports: [b2b, b2c, segment_comparison] }
  call_center_off:     { hidden: [telephony, wallboard, dialer, qa], call_metrics: false }
  call_center_on:      { visible: [softphone_bar, call_screens], segment_badge_in_call: true, reports: [calls, call_to_sale] }

# Decision scenarios (§10.4.4, §11.4) — machine-readable expectations for generated tests.
# IDs match docs/enterprise/requirements-traceability.md (SCN-nn, SCN-AI-nn).
scenarios:
  - { id: SCN-01, actor: can,    action: sales_b2c.order.read,          target: { type: order, segment: b2c },                       expect: 404 }
  - { id: SCN-02, actor: zeynep, action: search,                        target: { query: account_name, segment: b2b },               expect: { results: 0, suggestions_exclude: b2b, counts_exclude: b2b } }
  - { id: SCN-03, actor: tuba,   action: call_center.screen_pop,        target: { caller: contact, segments: [b2b] },                expect: { display: unknown_or_unauthorized, leak_fields: [] } }
  - { id: SCN-04, actor: okan,   action: call_center.screen_pop,        target: { caller: contact, segments: [b2b, b2c] },           expect: { display: customer_360, segment_badges: [b2b, b2c] } }
  - { id: SCN-05, actor: mert,   action: crm.opportunity.reassign,      target: { owner: can, segment: b2b },                        expect: { status: 200, audit: true } }
  - { id: SCN-06, actor: mert,   action: sales_b2c.order.update,        target: { owner: zeynep, segment: b2c },                     expect: 404 }
  - { id: SCN-07, actor: mert,   action: authz.segments.grant,          target: { user: can, segment: b2c },                         expect: { status: 403, reason: own_segments_only } }
  - { id: SCN-08, actor: mert,   action: authz.roles.assign,            target: { user: mert, role: admin },                         expect: { status: 403, reason: not_self } }
  - { id: SCN-09, actor: mert,   action: call_center.recording.listen,  target: { team: b2c_retail, segment: b2c },                  expect: 404 }
  - { id: SCN-10, actor: burak,  action: call_center.monitor.listen,    target: { team: customer_service },                          expect: { status: 200, notice_to_agent: true, audit: true }, policies: { live_monitoring_enabled: true } }
  - { id: SCN-11, actor: selin,  action: "*record*.update",             target: { any: visible_record },                              expect: 403 }
  - { id: SCN-12, tenant_mode: b2b_only, action: sales_b2c.any,         expect: { status: 404, code: MODULE_DISABLED, menu: absent } }
  - { id: SCN-13, tenant_modules_off: [call_center], action: call_center.any, expect: { status: 404, code: MODULE_DISABLED, permissions_effective: false, data_retained: true } }
  - { id: SCN-14, telephony_event: { did_tenant: A, body_tenant: B },    expect: { processed_in: A, tenant_b_touched: false } }
  - { id: SCN-15, actor: can,    action: mentions.create,               target: { user: zeynep, record_segment: b2c },               expect: { picker_lists: false, api_status: 422 } }
  - { id: SCN-16, actor: mert,   action: mentions.create,               target: { user: can, field: opportunity.description },       expect: { notification: separate, latency_p95_sec: 2, deep_link: true } }
  - { id: SCN-17, actor: can,    action: notifications.read,            target: { after: access_revoked },                           expect: { content_hidden: true } }
  - { id: SCN-18, event: delegation_expired,                             expect: { permission_removed: true, audit: true } }
  - { id: SCN-19, actor: deniz,  action: call_center.call.place,        target: { customer: b2c, consent: false },                   expect: { status: 422, code: CONSENT_REQUIRED, reason_shown: true } }
  - { id: SCN-20, client: data_service, action: lookup,                  target: { fields: [non_whitelisted] },                       expect: { field_returned: false, logged: true } }
  - { id: SCN-AI-01, actor: can,  action: ai_assistant.report.other,    target: { user: zeynep },                                    expect: { status: 403, reason: no_permission, existence_leak: false }, note: "Can has no report.other permission, so the target is never resolved; response is identical for any target id" }
  - { id: SCN-AI-02, actor: mert, action: ai_assistant.report.other,    target: { user: can, period: week },                         expect: { status: 200, transparency_log_for: can } }
  - { id: SCN-AI-03, actor: mert, action: ai_assistant.report.other,    target: { user: zeynep },                                    expect: { status: 404, existence_leak: false } }
  - { id: SCN-AI-04, actor: mert, action: ai_assistant.report.other,    target: { user: can, can_has_b2c: true },                    expect: { b2c_records_included: false } }
  - { id: SCN-AI-05, actor: mert, action: ai_assistant.report.other,    target: { user: can, private_note: true },                   expect: { private_note_included: false } }
  - { id: SCN-AI-06, content: prompt_injection_note,                    expect: { instruction_followed: false, tool_called: false, output_affected: false } }
  - { id: SCN-AI-07, content: summary_numbers,                          expect: { numbers_match_engine: exact, mismatch: reject } }
  - { id: SCN-AI-08, tenant: A,   action: ai_assistant.summary.own,     expect: { tenant_b_in_prompt_or_cache: false } }
  - { id: SCN-AI-09, users_with_different_authz: 2,                     expect: { cache_shared: false } }
  - { id: SCN-AI-10, event: access_revoked_then_open_old_summary,       expect: { unauthorized_sources_shown: false } }
  - { id: SCN-AI-11, model_server: down,                                expect: { deterministic_summary: true, notice: ai_narrative_unavailable } }
  - { id: SCN-AI-12, tenant_modules_off: [ai_assistant],                expect: { status: 404, menu: absent, scheduled_summaries: stopped, data_retained: true } }
  - { id: SCN-AI-13, content: note_with_mention,                         expect: { notification_triggered: false } }
  - { id: SCN-AI-14, event: user_deleted_kvkk,                          expect: { summaries_reports_history_embeddings_purged: true } }
