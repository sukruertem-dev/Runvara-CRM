    label: Modül ve satış modu yapılandırma (plan sınırları içinde)
    module: core
    permissions: [tenant.modules.manage, tenant.sales_mode.manage]
    cells: { admin: "●", manager: "—", sales_rep: "—", call_agent: "—", analyst: "—" }
    grants:
      admin: { mode: full, scope: all }
  - id: A02
    label: Tenant yapılandırması (pipeline, alan, workflow, marka)
