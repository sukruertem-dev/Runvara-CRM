    grants:
      admin:      { mode: full, scope: all }
      manager:    { mode: full, scope: team, constraints: [managed_teams_only, no_escalation, not_self] }
      sales_rep:  { mode: request, scope: own }
      call_agent: { mode: request, scope: own }
