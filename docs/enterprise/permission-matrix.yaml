  b2c_retail:       { name: B2C Perakende,       segments: [b2c],      managers: [elif] }
  mixed:            { name: Karma,               segments: [b2b, b2c], managers: [burak] }
  customer_service: { name: Müşteri Hizmetleri,  segments: [b2c],      managers: [burak], call_queue: true }
  mixed_queue:      { name: Karma Kuyruk,        segments: [b2b, b2c], managers: [burak], call_queue: true }

users:
  ayse:   { name: Ayşe Yılmaz,   role: admin,      b2b: true,  b2c: true,  scope: all,  teams: [],                 telephony: configure,           report_scope: all,          export: "Evet" }
  mert:   { name: Mert Kaya,     role: manager,    b2b: true,  b2c: false, scope: team, teams: [b2b_corporate],    telephony: recording_listen,    report_scope: "team,b2b",   export: "Politikaya bağlı" }
  elif:   { name: Elif Demir,    role: manager,    b2b: false, b2c: true,  scope: team, teams: [b2c_retail],       telephony: recording_listen,    report_scope: "team,b2c",   export: "Politikaya bağlı" }
  burak:  { name: Burak Aydın,   role: manager,    b2b: true,  b2c: true,  scope: team, teams: [mixed, customer_service, mixed_queue], telephony: recording_listen_and_live_monitoring, report_scope: "team,b2b,b2c", export: "Hayır" }
  can:    { name: Can Öz,        role: sales_rep,  b2b: true,  b2c: false, scope: own,  teams: [b2b_corporate],    telephony: place_calls,         report_scope: personal,     export: "Hayır" }
  zeynep: { name: Zeynep Arslan, role: sales_rep,  b2b: false, b2c: true,  scope: own,  teams: [b2c_retail],       telephony: none,                report_scope: personal,     export: "Hayır" }
  deniz:  { name: Deniz Çelik,   role: sales_rep,  b2b: true,  b2c: true,  scope: own,  teams: [mixed],            telephony: place_calls,         report_scope: personal,     export: "Hayır" }
