# Local stack: `node scripts/dev-env.mjs` (writes .env with random secrets) then `docker compose up --build`.
# Web http://localhost:3000 · API http://localhost:4000 (docs /docs) · Mailpit http://localhost:8025
# Host ports are overridable in .env: FLEXA_WEB_PORT, FLEXA_API_PORT, FLEXA_PG_PORT, FLEXA_REDIS_PORT, FLEXA_MAILPIT_PORT, FLEXA_S3_PORT
# Attachments: S3-compatible SeaweedFS on http://localhost:8333 (bucket `flexa`, created by s3-init).
name: flexa

x-node-env: &node-env
  NODE_ENV: production
  LOG_LEVEL: info
  REDIS_URL: redis://redis:6379
  FLEXA_MASTER_KEY: ${FLEXA_MASTER_KEY:?run node scripts/dev-env.mjs}
  DATABASE_URL: postgres://flexa_app:${FLEXA_APP_PASSWORD}@postgres:5432/flexa

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flexa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run node scripts/dev-env.mjs}
      FLEXA_OWNER_PASSWORD: ${FLEXA_OWNER_PASSWORD}
      FLEXA_APP_PASSWORD: ${FLEXA_APP_PASSWORD}
      FLEXA_RELAY_PASSWORD: ${FLEXA_RELAY_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./packages/db/sql/roles.sql:/flexa/roles.sql:ro
    ports: ["127.0.0.1:${FLEXA_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flexa"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:${FLEXA_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${FLEXA_MAILPIT_PORT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-s3", "-dir=/data", "-volume.max=50", "-master.volumeSizeLimitMB=256"]
    volumes: [s3data:/data]
    ports: ["127.0.0.1:${FLEXA_S3_PORT:-8333}:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  s3-init:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c", "echo 's3.bucket.create -name flexa' | weed shell -master=s3:9333 -filer=s3:8888"]
    depends_on:
      s3: { condition: service_healthy }
    restart: "no"

  migrate:
    build: { context: ., dockerfile: infra/docker/node-app.Dockerfile, args: { APP: api } }
    image: flexa-api:local
    command: ["node", "node_modules/@flexa/db/dist/cli.js"]
    environment:
      DATABASE_OWNER_URL: postgres://flexa_owner:${FLEXA_OWNER_PASSWORD}@postgres:5432/flexa
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: flexa-api:local
    environment: &api-env
      <<: *node-env
      API_PORT: 4000
      API_PUBLIC_URL: http://localhost:${FLEXA_API_PORT:-4000}
      WEB_BASE_URL: http://localhost:${FLEXA_WEB_PORT:-3000}
      CORS_ORIGINS: http://localhost:${FLEXA_WEB_PORT:-3000}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      CSRF_SECRET: ${CSRF_SECRET}
      # Local stack runs over plain http; production must keep the default (true).
      COOKIE_SECURE: "false"
      TRUST_PROXY: "true"
      # Per-IP limits. On this stack every E2E user, account and page shares one IP, so the CI E2E job raises
      # them (ci.yml); the limits themselves are covered by the API integration tests.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${FLEXA_S3_PORT:-8333}
      S3_BUCKET: flexa
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local
    ports: ["127.0.0.1:${FLEXA_API_PORT:-4000}:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Domain-event consumers (automation rules, schedules): same image as the API, no public port (ADR-0006).
  automation:
    image: flexa-api:local
    environment:
      <<: *api-env
      EVENT_CONSUMERS: "true"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build: { context: ., dockerfile: infra/docker/node-app.Dockerfile, args: { APP: worker } }
    image: flexa-worker:local
    environment:
      <<: *node-env
      SMTP_URL: smtp://mailpit:1025
      WORKER_HEALTH_PORT: 4100
      RELAY_DATABASE_URL: postgres://flexa_relay:${FLEXA_RELAY_PASSWORD}@postgres:5432/flexa
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile, args: { API_INTERNAL_URL: "http://api:4000" } }
    image: flexa-web:local
    ports: ["127.0.0.1:${FLEXA_WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  s3data:
  pgdata:
  redisdata:
